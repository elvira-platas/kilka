---
name: Quality checks

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install \
            --no-install-recommends \
            --yes \
            ripgrep rsync zip unzip

      - name: Show tool versions
        run: |
          php --version
          bash --version
          rsync --version | head -n 1
          zip -v | head -n 2
          unzip -v | head -n 2
          rg --version | head -n 1

      - name: Validate PHP syntax
        shell: bash
        run: |
          git ls-files -z '*.php' | xargs -0 -n1 php -l

      - name: Validate shell syntax
        run: bash -n scripts/build-packages.sh

      - name: Build and validate packages
        run: ./scripts/build-packages.sh

      - name: Check repository diff
        run: git diff --check
